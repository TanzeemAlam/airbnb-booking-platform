version: '3.8'

services:
  # MySQL Database (User, Booking, Payment services)
  mysql:
    image: mysql:8.0
    container_name: airbnb-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: airbnb_db
      MYSQL_USER: airbnb_user
      MYSQL_PASSWORD: airbnb_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 10s
    networks:
      - airbnb-network

  # PostgreSQL Database (Listing, Availability services)
  postgres:
    image: postgres:15
    container_name: airbnb-postgres
    environment:
      POSTGRES_DB: airbnb_db
      POSTGRES_USER: airbnb_user
      POSTGRES_PASSWORD: airbnb_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airbnb_user"]
      timeout: 20s
      retries: 10
      interval: 10s
    networks:
      - airbnb-network

  # Zookeeper (for Kafka coordination)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: airbnb-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - airbnb-network
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      timeout: 10s
      retries: 5
      interval: 5s

  # Kafka (Message broker)
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: airbnb-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    ports:
      - "9092:9092"
      - "29092:29092"
    networks:
      - airbnb-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      timeout: 10s
      retries: 5
      interval: 5s

  # Redis (Caching and distributed locks)
  redis:
    image: redis:7-alpine
    container_name: airbnb-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - airbnb-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 10s
      retries: 5
      interval: 5s

  # Zipkin (Distributed tracing UI - optional, read-only)
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: airbnb-zipkin
    ports:
      - "9411:9411"
    environment:
      STORAGE_TYPE: mem
    networks:
      - airbnb-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9411/health"]
      timeout: 10s
      retries: 5
      interval: 5s

volumes:
  mysql-data:
  postgres-data:
  redis-data:

networks:
  airbnb-network:
    driver: bridge
